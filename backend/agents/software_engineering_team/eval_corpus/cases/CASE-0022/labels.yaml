  description: >
    The session cookie above is issued `SameSite=None`, so a browser sends it
    on a cross-site POST. This endpoint mutates account state, authenticates
    purely on that cookie, and accepts a form-encoded body with no origin
    check and no CSRF token, so any third-party page can drive it on a
    logged-in user's behalf.
